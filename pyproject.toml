[project]
name = "job-desk"
version = "0.1.0"
description = "A daily, ranked digest of jobs and freelance projects, each with a tailored CV ready. The system never applies."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The API path exists so the repo is not a Claude Code script. Not needed to run the demo.
api = ["anthropic>=0.69"]
# Kept optional so the offline replay path stays light — see session 4.
#
# `fetch` was declared as bare `scrapling` until 2026-08-18, on the assumption
# that HTTP fetching and browser driving were separable there. They are not:
# importing `scrapling.fetchers` pulls curl_cffi and playwright at module load
# even when only the plain HTTP fetcher is wanted, so a `--extra fetch` install
# raised ImportError at the first request and the error message sent the reader
# back to the flag that had just failed them.
#
# The two tiers still mean something. `fetch` installs the packages; `browser`
# is the same set plus the browser binaries, which arrive through
# `playwright install chromium` and not through pip at all.
fetch = ["scrapling[fetchers]>=0.4"]
browser = ["scrapling[fetchers]>=0.4"]
# The six approved bases are .docx and the output is .docx — Noam edits it in
# Word after, so a PDF would be a dead end. There is no Word and no LibreOffice
# on this machine, which is also why the one-page check stays human.
docx = ["python-docx>=1.1"]

[project.scripts]
desk = "desk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis>=6",
    # The parser tests run against saved fixtures, so the parsing half is
    # always installed for development. Playwright still is not.
    "scrapling>=0.4",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
