name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # gitleaks scans the whole history, so the clone must carry it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Explicit full-history scan. The gitleaks action derives a commit range
      # per push event, which breaks on a root commit and on shallow clones.
      - name: gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --exit-code 1
        env:
          GITLEAKS_VERSION: 8.24.3

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: lint
        run: uv run ruff check .

      - name: tests
        run: uv run pytest -q

      # The offline reproduction promise: a clean clone runs with no API key.
      - name: offline demo
        run: uv run desk demo
        env:
          ANTHROPIC_API_KEY: ""
