# job-desk — search specification
# Session 1 output. Written from scratch on 2026-08-16.
# This file is the single source of truth for what counts as a relevant posting.
# Changing a criterion is an edit here, never a code change.

version: 1

# ---------------------------------------------------------------------------
# geography
# No commute ceiling. Region allowlist only; distance is reported per item
# so the decision stays with the human.
# ---------------------------------------------------------------------------
geography:
  regions:
    - haifa
    - north
    - sharon
    - center
  exclude_regions:
    - south
    - jerusalem

  # The cities each region is made of.
  #
  # These were comments on the region names until 2026-08-18. The geography gate
  # cannot read a comment, so a location field naming Haifa was placed nowhere
  # and every posting passed on silence. Promoted to data unchanged: no city was
  # added to a region and none was moved.
  #
  # Excluded regions carry lists too. A posting can only be blocked for being
  # somewhere the spec can name the cities of.
  #
  # Spelling variants sit next to their city. The gate matches the text as the
  # board wrote it and never guesses at a form it was not given, so a variant
  # that is missing here is a posting that is placed nowhere.
  cities:
    haifa:
      - חיפה
    north:
      - קרית ביאליק
      - קרית מוצקין
      - קרית ים
      - קרית אתא
      - קריות
      - עכו
      - נשר
      - טירת כרמל
      - יקנעם
      - כרמיאל
      - מגדל העמק
      - נצרת
      - עפולה
      - אלון תבור
    sharon:
      - רמת השרון        # ✅ נועם, 18.08.2026 — היחידה שנשארה מהרשימה
      - נתניה
      - כפר סבא
      - רעננה
      - הרצליה
      - קיסריה
      - חדרה
    center:
      # 167 of the 191 AllJobs rows write the abbreviation and never the name.
      - ת"א
      - ת״א
      - תל אביב
      - תל-אביב
      - תל אביב יפו
      - תל אביב-יפו
      - רמת גן
      - גבעתיים
      - פתח תקווה
      - פתח תקוה
      - בני ברק
      - חולון
      - ראשון לציון
      - רחובות
    south:
      - באר שבע
      - אשדוד
      - אשקלון
      - קרית גת
      - דימונה
      - אילת
      - שדרות
    jerusalem:
      - ירושלים
      - מבשרת ציון
      - בית שמש

  # ✅ נועם, 18.08.2026: מתוך 83 המחרוזות שהשער לא הצליח למקם, רק רמת השרון
  # נשארת. כל השאר יוצאות.
  #
  # Rejected by name, not by region. Several of these sit inside a region the
  # spec accepts — בת ים, הוד השרון, גבעת שמואל, קרית אונו, אור עקיבא,
  # פרדס חנה כרכור — and the ruling overrides the region for them. That is why
  # this is a list of towns and not an edit to the region lists: reversing any
  # one of them is moving a single name from here into its region above.
  #
  # A posting that names one of these AND an accepted city still passes. The
  # rule has always been that any accepted city is enough, and it did not change.
  exclude_cities:
