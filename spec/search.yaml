      - שוהם
      - יבנה
      - גבעת שמואל
      - יקום
      - בית קמה
      - יהוד מונוסון
      - ערד
      - מגדל תפן
      - נס ציונה
      - פארק תעשיות עידן הנגב
      - קרית אונו
      - פארק תעשיות עמק חפר
      - מועצה אזורית עמק חפר
      - בית דגן
      - עומר
      - אור עקיבא
      - קרית מלאכי
      - בת ים
      - כוכב יאיר צור יגאל
      - גדרה
