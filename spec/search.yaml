  remote:
    israel_based: true
    international: false

work_arrangement:       # all accepted; recorded per item, never filtered on
  - onsite
  - hybrid
  - remote

# ---------------------------------------------------------------------------
# hard gates — deterministic, run before any model call
# ---------------------------------------------------------------------------
gates:
  seniority:
    mode: block
    max_required_years: 3          # "3 years" passes, "4+" and "5 years" blocked
    unstated: pass                 # no stated requirement => not a blocker
    range_rule: use_lower_bound    # "3-5 years" is read as 3 and passes;
                                   # switch to use_upper_bound to tighten

  degree:
    mode: block
    # Blocked when the posting demands one of these.
    #
    # Every spelling a board might use sits under its list. The Hebrew was a
    # trailing comment until 2026-08-18, and since every posting in the store is
    # Hebrew, the gate matched nothing at all and blocked no one. The lists
    # themselves are unchanged — only the spellings were promoted to data.
    closed_lists:
      - name: computer science
        aliases:
          - מדעי המחשב
      - name: industrial engineering
        aliases:
          - הנדסת תעשייה וניהול
          - הנדסת תעשיה וניהול
          - תעשייה וניהול
      - name: information systems
        aliases:
          - מערכות מידע
      - name: software engineering
        aliases:
          - הנדסת תוכנה
      - name: statistics
        aliases:
          - סטטיסטיקה
      - name: mathematics
        aliases:
          - מתמטיקה
    open_clause_overrides: true    # an open clause cancels the block
    open_clause_markers:           # if any of these appear, the list is not closed
      - "או תואר רלוונטי אחר"
      - "תואר רלוונטי"
      - "השכלה רלוונטית"
      - "or other relevant degree"
      - "relevant degree"
      # Added 2026-08-18, measured rather than imagined. On the re-fetched
      # corpus, 52 of the 271 postings the degree gate blocked carried an open
      # clause in a wording nobody had written down — "או תחום רלוונטי" alone
      # accounts for all but a handful.
      #
      # A marker only cancels a demand it sits beside. "תחום רלוונטי" is also
      # how a posting describes experience, and "3 שנות ניסיון בתחום רלוונטי"
      # must not unblock a closed degree list further up the page.
      - "תחום רלוונטי"
      - "תחום דומה"
      - "תחום כמותי דומה"
      - "תחום קשור"
      - "תחום מקביל"
      - "השכלה חלופית"
      - "או תחום אחר"
      - "similar field"
      - "related field"
    held_degree: "B.A. Government & Strategy, Reichman University"

  freshness:
    max_age_days: 7
    first_run_backfill_days: 30    # one-time, to fill the store

  duplicates:
    mode: collapse                 # same role from several sites or agencies
                                   # becomes a single item
  already_applied:
    mode: suppress                 # never resurface a posting already applied to

# ---------------------------------------------------------------------------
# role families
# Each family maps to a CV base (session 2) and carries its own search terms.
# ---------------------------------------------------------------------------
families:

  data_analyst:
    cv_base: data_analyst
    # Not a BI developer. Power BI and Tableau are coursework; the real
    # dashboards were built in Monday.com and in code. Kept broad via
    # the bare term "analyst".
    terms_he:
      - אנליסט
      - אנליסט נתונים
      - אנליסט דאטה
      - מנתח נתונים
      - אנליסט BI
    terms_en:
      - analyst
      - data analyst
      - BI analyst
      - business intelligence

  ai_builder:
    cv_base: ai_builder
    # "מהנדס" titles almost always carry a closed degree list — they are
    # kept in, and the degree gate is what removes them.
    # "Copilot" deliberately excluded: no hands-on experience with it.
    terms_he:
      - מהנדס AI
      - מומחה AI
      - מיישם AI
      - מפתח AI
      - בינה מלאכותית
      - סוכני AI
      - אוטומציה חכמה
      - מומחה אוטומציה
      - הטמעת AI
      - RAG
    terms_en:
      - AI engineer
      - AI builder
      - AI developer
      - LLM engineer
      - GenAI
      - agentic
      - prompt engineer
      - AI automation
      - AI solutions
      - AI adoption
      - automation specialist
      - RAG

  product_project:
    cv_base: product_project
    # Systems analysis and systems implementation are out — no experience
    # and no knowledge in that area.
    terms_he:
      - מנהל פרויקט
      - מנהל מוצר
      - מנהל פרויקטים טכנולוגיים
    terms_en:
      - product manager
      - project manager
      - technical program manager
      - PMO

  strategy_public:
    cv_base: strategy_public
    terms_he:
      - יועץ
      # Inflections are listed, not inferred. The family matcher reads the term
      # as the board wrote it and never guesses at a form it was not given —
      # the same rule the city lists follow. אסטרטגי alone does not match
      # אסטרטגיה, so both are here. 2026-08-18.
      - אסטרטגי
      - אסטרטגיה
      - אסטרטגית
      - ייעוץ אסטרטגי
      - טרנספורמציה דיגיטלית
      - שלטון מקומי
      - מערך הדיגיטל
    terms_en:
      - consultant
      - strategic
      - strategy
      - digital transformation
      - public sector

# ---------------------------------------------------------------------------
# sites — built one at a time, in this order
# ---------------------------------------------------------------------------
sites:

  - id: alljobs
    order: 1
    enabled: true
    fetch: scrapling_http
    rate_limit_rps: 0.5
    notes: largest Israeli inventory, most tractable to parse

  - id: drushim
    order: 2
    enabled: true
    fetch: scrapling_http
    rate_limit_rps: 0.5
    notes: overlaps AllJobs; the resolver collapses the duplicates

  - id: gotfriends
    order: 3
    enabled: true
    fetch: scrapling_http
    rate_limit_rps: 0.5
    categories: [ai-engineer, llm-engineer, data-analyst, bi-developer,
                 data-engineer, product-analyst, product-manager]
    notes: >
      Small inventory, heavily center-weighted, but high AI relevance.
      An agency, not a board: no free-text search, so this module is driven by
      the shelves above rather than by the family terms. It states no date and
      no employer on any listing, by design on the agency's side — posted_at is
      empty here always and freshness falls back to the store's first-seen.
      product-manager added 2026-08-18 (112 shelf pages); data-scientist was
      offered and declined — its postings are algorithm roles behind a closed
      degree list, which the degree gate would drop anyway.

  - id: jobify
    order: 4
    enabled: true
    fetch: attached_browser        # the already-logged-in Chrome session
    rate_limit_rps: 0.2            # twenty page loads a day, at human pace
    stealth: false                 # no bypass; the site invites reading
    role_shelves_from: profile     # the 20 roles Noam picked in his account
    server_side_filters:           # applied by the site, not by us
      radius_km_from: haifa
      salary_floor_nis: 10000
      window: since_my_last_visit
    notes: >
      An aggregator, not a board — Joint / Ministry of Labour backed. It fans
      in at least eight sources and two of them are already ours: the URL
      suffix names the origin (aj alljobs, vip the alljobs VIP board, dr
      drushim, in indeed, emp a direct employer, jk/id/sh unidentified).
      It does NOT dedupe across its own sources: the same role was seen twice
      on one page, once -dr and once -jk. Enabled anyway because it is the
      only source that states employer, real city, scope and arrangement per
      card, and the only one whose server-side filters are the spec's own —
      radius instead of a city list, a salary floor, and a since-last-visit
      window. Its public path is not viable: the sitemap is 2,199 shards with
      no titles, so a week is ~20k requests. The logged-in path is 20 page
      loads a day. Two things it reports are its own estimates and never
      facts: the salary band, which the site itself labels AI-derived and not
      the employer's, and its match percentage. Both enter as signals; the
      analyst is measured against Noam's labels, not against Jobify's model.

  - id: linkedin
    order: 5
    enabled: true
    fetch: guest_api               # the logged-out endpoints, no session at all
    rate_limit_rps: 0.5            # one request every two seconds
    stealth: false                 # no bypass exists in the fetching layer
    location: Israel               # the endpoint takes a place name, not a code
    window_days: 7                 # applied by LinkedIn, not by us
    max_details: 200               # one request each; the ceiling is reported
    notes: >
      Two logged-out endpoints, no account, no cookie, no key: a search that
      takes a term, a place and a window, and a posting page that carries the
      description. Read for personal use at a polite rate.
      What is NOT done: no login,
      no session, no cookie, no TLS impersonation, no anti-bot bypass, no
      CAPTCHA solving, nothing behind an authentication wall. Unlike every
      other board here the freshness window is applied server-side, so the
      crawl stops on LinkedIn's own end-of-results sentinel rather than on the
      first old item — the unfiltered feed is not in date order and a
      four-month-old posting came back on page one.

  - id: xplace
    order: 6
    enabled: true
    fetch: scrapling_http
    # ✅ 19.08.2026 — the site's the fetch rules asks for Crawl-delay: 10, and 0.5
    # requests per second is five times faster than that. Scraping politely
    # means reading what the host asked for and doing it, so this is 0.1.
    # the fetch rules also carries `Disallow: /*jobs*?`: a query string on a jobs
    # URL is off-limits, which is why the module walks the shelves and never
    # paginates by parameter.
    rate_limit_rps: 0.1
    pipeline: freelance            # separate flow — scope and budget, not
                                   # seniority and degree

# ---------------------------------------------------------------------------
# daily digest
# ---------------------------------------------------------------------------
digest:
  max_items: 5
  min_score: 0.6                   # an empty day is a valid answer
  order_by: score_desc
  include_per_item:
    - score
    - one_line_reason
    - gate_results
    - region_and_distance
    - recommended_channel          # button | person | skip
    - tailored_cv_path
  schedule:
    cron: "0 8 * * *"
    timeout_seconds: 900           # explicit — Power Nap hangs untimed jobs

# ---------------------------------------------------------------------------
# analyst — session 5
# The knobs the analyst reads. They live here for the same reason every other
# threshold does: changing what counts as a fit is an edit to this file, never
# a code change.
# ---------------------------------------------------------------------------
analyst:

  family:
    min_confidence: 0.5
    # No family is a real answer and the cheap one. A microbiologist matches
    # nothing here, and there is no reason to spend a judgment-tier call
    # scoring a fit nobody will read.
    on_no_family: stop

  reflect:
    # The evaluator half of the extraction loop. A requirement whose quoted
    # span is not in the posting is not a weak requirement, it is an invented
    # one, and it is dropped rather than argued with.
    max_rounds: 2
    drop_unanchored: true
    normalize_whitespace: true

  score:
    channel:
      # Advice, never an action. The system does not apply.
      skip_below: 0.6        # the digest floor: below it nothing is recommended
      person_min: 0.8        # a direct approach is worth it only on a strong
                             # fit, and only where the employer is named at all

# ---------------------------------------------------------------------------
# manager — session 7
# ---------------------------------------------------------------------------
manager:

  states:
    - discovered
    - shortlisted
    - approved
    - applied
    - ack
    - interview
    - offer
    - closed

  follow_up_days: 7          # no answer within this window raises a nudge
  stale_days: 21             # untouched this long and it closes itself

  delivery:
    telegram: true           # on since 19.08.2026 — bot @NoamClaudeBot, credentials in .env
    auto_apply: never        # stated here so the answer is in the spec, not
                             # only in the code
